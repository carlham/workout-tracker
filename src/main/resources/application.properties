spring.application.name=workout-tracker
spring.datasource.url=jdbc:postgresql://localhost:5432/workout
spring.datasource.username=workout
spring.datasource.password=${DB_PASSWORD:workout}
spring.jpa.hibernate.ddl-auto=validate
# Load lazy collections in batches instead of one query per row (avoids N+1 on paged lists)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Auth: set JWT_SECRET (32+ characters) in any real deployment; the default is for local development only
app.auth.jwt-secret=${JWT_SECRET:local-dev-only-secret-change-me-in-production}
app.auth.access-token-ttl=15m
app.auth.refresh-token-ttl=14d
