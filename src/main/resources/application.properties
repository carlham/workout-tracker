spring.application.name=workout-tracker
spring.datasource.url=jdbc:postgresql://localhost:5432/workout
spring.datasource.username=workout
spring.datasource.password=${DB_PASSWORD:workout}
spring.jpa.hibernate.ddl-auto=validate
# Load lazy collections in batches instead of one query per row (avoids N+1 on paged lists)
spring.jpa.properties.hibernate.default_batch_fetch_size=50